name: Keep Render backend awake

on:
  schedule:
    # Render's free tier spins down after 15 minutes of inactivity, so a
    # 10-minute ping is enough to keep it awake while using fewer runs.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 \
            https://ev-infra-map-india.onrender.com/health
