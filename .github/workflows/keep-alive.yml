name: Keep Render backend awake

on:
  schedule:
    # GitHub Actions runs on a best-effort schedule; every 5 minutes is the
    # minimum supported interval. This keeps Render's free-tier service from
    # spinning down after 15 minutes of inactivity.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 \
            https://ev-infra-map-india.onrender.com/health
